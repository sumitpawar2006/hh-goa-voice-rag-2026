services:
  - type: web
    name: nexus-voice-rag-2026
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: QDRANT_PATH
        value: /app/runtime/qdrant
      - key: GENERATOR_PROVIDER
        value: extractive
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: BOOTSTRAP_FROM_DATASET
        value: "false"
      - key: DATASET_LANGUAGE
        value: hi
      - key: DATASET_SPLIT
        value: validation
      - key: DATASET_SAMPLE_SIZE
        value: "50"
      - key: CHUNKING_STRATEGY
        value: semantic
      - key: RERANKER_MODE
        value: lexical
      - key: MIN_RELEVANCE_SCORE
        value: "0.50"
      - key: PREWARM_EMBEDDINGS
        value: "true"
