[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hh-goa-voice-rag-2026"
version = "0.1.0"
description = "Grounded, voice-enabled multilingual RAG for Hacker House Goa 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cachetools>=6.1,<7",
  "datasets>=4.0,<5",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<2",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "orjson>=3.11,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "qdrant-client[fastembed]>=1.15,<2",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]
local-llm = ["llama-cpp-python>=0.3.16,<0.4"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "rag"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
